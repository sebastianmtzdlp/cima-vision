<dialog id="lb" aria-label="Foto ampliada"><button type="button" aria-label="Cerrar">CERRAR</button><img alt=""></dialog>
<script>
(function(){var d=document.getElementById('lb'),im=d.querySelector('img');
document.querySelectorAll('.mosaic figure').forEach(function(f){f.addEventListener('click',function(){var i=f.querySelector('img');im.src=i.src;im.alt=i.alt;d.showModal()})});
d.addEventListener('click',function(){d.close()});})();
</script>
