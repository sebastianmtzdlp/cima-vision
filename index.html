<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CIMA Vision</title>
  <meta name="description" content="CIMA Vision — fotografía y consultoría de imagen.">
  <style>
    :root { --bg:#f6f2ec; --fg:#1d1b19; --muted:#6f6a63; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141312; --fg:#f1ece4; --muted:#9a948a; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--fg); font-family: Georgia, "Times New Roman", serif;
           display: grid; place-items: center; padding: 24px; text-align: center; }
    h1 { font-weight: 400; font-size: clamp(2rem, 7vw, 3.5rem); letter-spacing: .12em; margin: 0 0 .5rem; text-transform: uppercase; }
    p { color: var(--muted); margin: 0; font-size: 1.05rem; }
  </style>
</head>
<body>
  <main>
    <h1>CIMA Vision</h1>
    <p>Fotografía y consultoría de imagen. Sitio nuevo en camino.</p>
  </main>
</body>
</html>
